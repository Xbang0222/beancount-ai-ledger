# ============================================================
# 账套配置：账本清单与账本之间的往来镜像
# 写法见 docs/REFERENCE.md「多本账」。新增账本使用：
#   python3 scripts/ledger.py new-book <名称> [--template personal|business|minimal] [--link <已有账本>]
# ============================================================

[ledger]
timezone = "Asia/Shanghai"      # 记账时区：注入 time、校验日期与时间是否晚于当前时刻均以此为准
base_currency = "CNY"           # 本位币：networth 折算的目标币种
# reconcile_days = 35           # 有余额的账户超过该天数未经 balance 核对时，doctor 给出提醒；默认 35，0 为不提醒

[books.personal]
title = "个人账本"
kind = "personal"

# ------------------------------------------------------------
# 其他会计主体（店铺、工作室、家庭共同账、多人 AA 的活动经费）使用 new-book 新建：
#   python3 scripts/ledger.py new-book shop --template business --title "我的小店" --link personal
# 该命令追加如下配置，也可手工编写：
#
# [books.shop]
# title = "我的小店"
# kind = "business"          # business 的月度报告计算经营结余；personal 计算储蓄率
# consolidate = true         # 是否并入 networth 的合并资产负债；默认 true，与他人共有的账本设为 false
#
# [[mirrors]]                # 一对往来镜像科目：同一笔业务在两本账各登记一边，两侧余额合计必须为 0
# name = "personal 垫付 shop"
# currency = "CNY"
# accounts = { personal = "Assets:Receivable:Shop", shop = "Liabilities:OwnerLoan" }
#
# 店铺与他人合伙、按月分配利润时配置 [dividend]，命令为 ledger.py dividend YYYY-MM，写法见 docs/REFERENCE.md「利润分配」：
#
# [dividend]
# book = "shop"
# partners = [
#   { name = "我", payee = "股东", share = 0.6, owner = true },   # owner = true 标注账本所有者本人：networth 将
#   { name = "合伙人小王", share = 0.4 },                         # 其余各方尚未分配的利润从净资产中扣除
# ]
#
# 按固定周期发生的业务（每周定投、每月房租）配置 [[recurring]]，brief 与 doctor 列出漏记的日期，写法见 docs/REFERENCE.md「周期事项」：
#
# [[recurring]]
# book = "personal"
# name = "每月房租"
# every = 5                  # "daily"、星期的英文（"monday"）或每月几号
# since = 2026-10-05
# match = "房租"
#
# 只统计某一事项（一次旅行、装修、婚礼）的花费时不必新建账本，使用标签即可，见 rules/tags.md。
# ------------------------------------------------------------

# ============================================================
# 对方与摘要的写法规则：本节为唯一来源，`python3 scripts/ledger.py rules` 将其输出为对照表，brief 同时输出。
# add / pair / amend 拒绝不合规的分录并提示正确写法，check 检查全部账目。整段删除即不做写法检查。
# 各键的作用见 docs/REFERENCE.md「写法规则」，补充规定见 rules/naming.md。
# ============================================================
[naming]
# 摘要括号内只允许下列固定标记；其他补充说明一律写入 note: 元数据
markers = ["股东往来", "测试", "按利息处理", "按手续费处理"]
# 不得单独用作对方名称的空泛词
banned_payees = ["个人", "测试", "银行", "供应商", "商家", "商户", "未知"]
# 费用冲回、收入冲减时，摘要必须以下列词结尾，例如「餐饮-燕麦退款」「销售退回」
refund_suffix = ["退款", "退回"]
# 双向科目：借贷两个方向均属正常发生额，例如投资盈亏的收益与亏损，不按退款检查
two_way = ["Income:Invest:PnL"]
# 记入兜底科目时必须写 note:，说明具体事项以及现有分类均不适用的原因
note_required = ["Expenses:Other"]
# 找不到分类时的处理顺序，rules 原样输出
fallback = [
  "先执行 ledger.py lookup <关键词> 检索速查词典与分类表：先按物品查，未命中再按商家或平台查",
  "大类定得下、小类对不上：记该大类的「其他」小类（Shopping:Other、Entertainment:Other、Travel:Other），没有「其他」小类的挑最接近的",
  "大类都对不上：参考统计局八大类和主流记账 App 的默认分类挑最接近的；确是会反复出现的新品类，就在 accounts.beancount 开新科目、在下面 prefix 配好开头、补进 rules/classification.md 和 rules/dictionary.md",
  "实在判断不了：记 Expenses:Other，摘要写「其他-<具体东西>」，note: 写清是什么，回报时告诉用户；不问用户记哪类",
  "连是消费、借出还是代垫都不清楚：先挂往来，不记费用（只有这类事实才问用户）",
]
# 「大类-事项」中不得单独用作事项的笼统词
vague_items = ["日用品", "消费", "支出", "杂项", "商品", "东西", "购物", "其他"]

# 摘要开头由记账科目决定；一笔分录有多个收支科目时，按金额最大者确定。
# 新开的收支科目须在此配置摘要开头，否则 check 报错；new-book 新建的账本自动追加各自的一段。
[naming.prefix.personal]
"Expenses:Food" = "餐饮-"
"Expenses:Housing" = "居住-"
"Expenses:Transport" = "交通-"
"Expenses:Shopping" = "购物-"
"Expenses:Entertainment" = "文娱-"
"Expenses:Travel" = "旅行-"
"Expenses:Learning" = "教育-"
"Expenses:Medical" = "医疗-"
"Expenses:Fitness" = "运动-"
"Expenses:PersonalCare" = "个护-"
"Expenses:Pet" = "宠物-"
"Expenses:Kids" = "育儿-"
"Expenses:Social" = "交际-"
"Expenses:Insurance" = "保险-"
"Expenses:Service" = "服务-"
"Expenses:Tax" = "税费-"
"Expenses:Finance" = "财务费用-"
"Expenses:SideBiz" = "副业成本-"
"Expenses:Other" = "其他-"
"Income:Salary" = "工资收入-"
"Income:Bonus" = "奖金收入-"
"Income:Labor" = "劳务收入-"
"Income:SideBiz" = "副业收入-"
"Income:Redpacket" = "红包收入-"
"Income:Invest" = "投资收益-"
"Income:Invest:Interest" = "利息收入-"
"Income:Benefit" = "社保入账-"
"Income:Other" = "其他收入-"

# 固定场景：分录只涉及下列科目时，对方与摘要只能按此书写；payee 省略表示对方不限，narration 省略表示摘要开头不限。
# 账户更名或新增结算账户后，同步修改 when 与 with。写法的完整对照见 rules/naming.md 第 7 节。
[[naming.patterns]]
book = "personal"
name = "自有账户之间的划转"
when = ["Assets:Cash", "Assets:Bank", "Assets:Alipay", "Assets:Wechat"]    # 分录只涉及这些科目
narration = ["银行转账-", "银行取现", "银行存现", "现金兑换"]
hint = '对方写转出机构，摘要写「银行转账-<转出>转<转入>」，如 "微信" "银行转账-微信转招行"；取现、存现写「银行取现」「银行存现」；与他人以现金兑换电子余额，对方写兑换对象，摘要写「现金兑换微信零钱」'

[[naming.patterns]]
book = "personal"
name = "负债的借入与偿还"
when = ["Liabilities:CreditCard", "Liabilities:Huabei", "Liabilities:Baitiao", "Liabilities:Loan", "Liabilities:Payable"]
with = ["Assets:Cash", "Assets:Bank", "Assets:Alipay", "Assets:Wechat"]    # 其余科目只能是这些
narration = ["偿还", "借款-", "其他应付款-", "信用卡取现"]
hint = '对方写信贷机构或出借人。还款如 "蚂蚁花呗" "偿还花呗"、"京东" "偿还京东白条"、"招商银行" "偿还招行信用卡"、"朋友小王" "偿还小王借款"；借入如 "国家开发银行" "借款-助学贷款放款"'

# 账本之间的往来可同样配置固定场景，例如个人账与店铺账：
# [[naming.patterns]]
# book = "personal"
# name = "个人账与店铺之间的往来"
# when = ["Assets:Receivable:Shop", "Liabilities:Shop"]
# with = ["Assets:Bank", "Assets:Wechat", "Assets:Alipay"]
# payee = ["商店"]
# narration = ["代垫商店", "代收商店", "收回商店", "归还商店"]
# hint = "个人账不登记店铺的经营收支"

# 对方或摘要中不得出现的写法：field 为 "narration"（摘要，默认）或 "payee"（对方）；pattern 为正则表达式，
# 命中即拒绝；hint 为拒绝时给出的改法。误拦正常写法时，在 pattern 的排除字符中补充。
[[naming.forbidden]]
name = "具体日期"
pattern = '\d{1,2}月\d{1,2}[日号]|(?<!\d)\d{1,2}号(?![线楼门口店桌厅馆院位车机仓柜铺色球电码汽油柴航风字房室库站台])|昨天|今天|明天|前天|昨晚|今晚'
hint = "交易日期由分录首行的日期表达，不写入摘要；所属期间可以保留，如「居住-9月房租」；其余日期信息写入 note:"

[[naming.forbidden]]
name = "具体时刻"
pattern = '(?<!\d)\d{1,2}[:：]\d{2}(?!\d)|(?<!\d)\d{1,2}点(?![券卡数心评赞击位读阵式])'
hint = "交易时刻写入 time: 元数据；班次、场次等写入 note:"

[[naming.forbidden]]
field = "payee"
name = "注册全称"
pattern = '有限公司|有限责任公司|个体工商户|经营部|收单'
hint = "对方写店名简称或业务描述，如「张记饭店」「便利店」，不写营业执照名称或收单机构名称"

[[naming.forbidden]]
field = "payee"
name = "未统一的统称"
pattern = '^(餐厅|饭店|饭馆|小卖部|小超市)$'
hint = "店名不明时同一类对方使用同一个统称：正餐堂食写「餐馆」，零售小店写「便利店」；已知店名的写店名简称"
