name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 单元测试
        run: python -m pytest tests/ -q
        env:
          PYTHONIOENCODING: utf-8
      - name: 校验账本（含跨账本对账）
        run: python scripts/ledger.py check
      - name: 序时簿排版检查
        run: python scripts/ledger.py fmt --check
      - name: 校验示例账本
        run: |
          python scripts/ledger.py --root examples/demo check
          python scripts/ledger.py --root examples/demo fmt --check
          bean-check examples/cookbook.beancount
