name: CI

on:
  push:
    branches: ["**"]   # 推标签不重复跑，发布流程自己会测
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 模板仓库本身：多平台跑完整测试
  test:
    if: github.repository == 'Xbang0222/beancount-ai-ledger'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 代码规范
        run: python -m ruff check scripts tests
      - name: 单元测试
        run: python -m pytest tests/ -q
        env:
          PYTHONIOENCODING: utf-8
      - name: 环境自检
        run: python scripts/ledger.py doctor
      - name: 校验账本（含跨账本对账）
        run: python scripts/ledger.py check
      - name: 序时簿排版检查
        run: python scripts/ledger.py fmt --check
      - name: 校验示例账本
        run: |
          python scripts/ledger.py --root examples/demo check
          python scripts/ledger.py --root examples/demo fmt --check
          bean-check examples/cookbook.beancount

  # 用模板建的个人账本仓库：只校验账本，省 Actions 分钟数
  ledger:
    if: github.repository != 'Xbang0222/beancount-ai-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 校验账本（含跨账本对账）
        run: python scripts/ledger.py check
