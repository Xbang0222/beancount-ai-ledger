name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Xbang0222/beancount-ai-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 测试与校验
        run: |
          python -m pytest tests/ -q
          python scripts/ledger.py check
          python scripts/ledger.py --root examples/demo check
      - name: 核对版本号
        run: |
          version="$(python scripts/ledger.py --version | awk '{print $2}')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 ledgerlib.__version__（${version}）不一致"
            exit 1
          fi
      - name: 从 CHANGELOG.md 提取发布说明
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          if not notes:
              raise SystemExit(f"CHANGELOG.md 里没有 {version} 的条目")
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
