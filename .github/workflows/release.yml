name: Release

# 两种触发方式：推送 v* 标签；或在 Actions 页面手动运行，按 ledgerlib.__version__ 在当前提交上打标签。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Xbang0222/beancount-ai-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 测试与校验
        run: |
          python -m ruff check scripts tests
          python -m pytest tests/ -q
          python scripts/ledger.py check
          python scripts/ledger.py --root examples/demo check
      - name: 确定版本号
        id: ver
        run: |
          version="$(python scripts/ledger.py --version | awk '{print $2}')"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与 ledgerlib.__version__（${version}）不一致"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: 从 CHANGELOG.md 提取发布说明
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          if not notes:
              raise SystemExit(f"CHANGELOG.md 里没有 {version} 的条目")
          open("release-notes.md", "w", encoding="utf-8").write(notes + "\n")
          PY
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 已经发布过了，先在 ledgerlib/__init__.py 和 CHANGELOG.md 里升版本号"
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
