name: 功能建议
description: 新功能、新命令，或对现有功能的改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 需要完成的事项，以及目前无法完成或不便完成的原因。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      description: 期望的解决方式；可说明对 AI 的表述与期望得到的结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
