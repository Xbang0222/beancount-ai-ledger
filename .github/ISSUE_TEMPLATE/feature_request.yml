name: 功能建议
description: 新功能、新命令，或者对现有功能的改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题
      description: 你想做什么，现在为什么做不到或者不方便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的做法
      description: 你希望怎么解决，可以写想跟 AI 怎么说、希望得到什么结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法
