name: 报告问题
description: 脚本出错、结果不正确或文档有误
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **不得粘贴真实的账本内容。** 复现问题使用 `examples/demo` 示例账本，或自行构造虚拟数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生的情况，以及与预期的差异。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 执行的命令，以及用到的分录；使用虚拟数据。
      placeholder: |
        python3 scripts/ledger.py --root examples/demo report personal 2026-09
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: 命令输出
      description: 完整的报错或输出内容。
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: doctor 输出
      description: 执行 `python3 scripts/ledger.py doctor`，删除仓库地址等个人信息后粘贴于此。
      render: text
  - type: input
    id: environment
    attributes:
      label: 操作系统与 AI 工具
      placeholder: 例如 macOS 15 + Claude Code，Windows 11 + Codex
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已搜索现有 Issue，未发现重复
          required: true
        - label: 上述内容不包含真实的账本数据
          required: true
