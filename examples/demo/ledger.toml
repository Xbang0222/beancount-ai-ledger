# ============================================================
# 账套配置：账本清单与账本之间的往来镜像
# 写法见 docs/REFERENCE.md「多本账」。新增账本使用：
#   python3 scripts/ledger.py new-book <名称> [--template personal|business|minimal] [--link <已有账本>]
# ============================================================

[ledger]
timezone = "Asia/Shanghai"      # 记账时区：注入 time、校验日期与时间是否晚于当前时刻均以此为准
base_currency = "CNY"           # 本位币：networth 折算的目标币种

[books.personal]
title = "个人账本（示例）"
kind = "personal"

[books.shop]
title = "网店（示例）"
kind = "business"

# personal ⇄ shop 往来镜像，由 new-book --link 生成：每对两侧余额合计必须为 0，由 reconcile 核对
[[mirrors]]
name = "personal 垫付 shop"
currency = "CNY"
accounts = { personal = "Assets:Receivable:Shop", shop = "Liabilities:OwnerLoan" }

[[mirrors]]
name = "personal 代收/占用 shop 资金"
currency = "CNY"
accounts = { personal = "Liabilities:Shop", shop = "Assets:Receivable:Owner" }

# ============================================================
# 对方、摘要与 note 的写法规则：本节为唯一来源，`python3 scripts/ledger.py rules` 将其输出为对照表，brief 同时输出。
# add / pair / amend 拒绝不合规的分录并提示正确写法，check 检查全部账目。整段删除即不做写法检查。
# 各键的作用见 docs/REFERENCE.md「写法规则」，补充规定见 rules/naming.md。
# ============================================================
[naming]
# 摘要括号内只允许下列固定标记；其他补充说明一律写入 note: 元数据
markers = ["股东往来", "测试", "按利息处理", "按手续费处理"]
# 不得单独用作对方名称的空泛词
banned_payees = ["个人", "测试", "银行", "供应商", "商家", "商户", "未知"]
# 费用冲回、收入冲减时，摘要必须以下列词结尾，例如「餐饮-燕麦退款」「销售退回」
refund_suffix = ["退款", "退回"]
# 双向科目：借贷两个方向均属正常发生额，例如投资盈亏的收益与亏损，不按退款检查
two_way = ["Income:Invest:PnL"]
# 记入兜底科目时必须写 note:，说明具体事项以及现有分类均不适用的原因
note_required = ["Expenses:Other"]
# note 的字数上限，不含导入来源的备注原文；0 为不限
note_max = 60
# 找不到分类时的处理顺序，rules 原样输出
fallback = [
  "先执行 ledger.py lookup <关键词> 检索速查词典与分类表：先按物品查，未命中再按商家或平台查",
  "大类定得下、小类对不上：记该大类的「其他」小类（Shopping:Other、Entertainment:Other、Travel:Other），没有「其他」小类的挑最接近的",
  "大类都对不上：参考统计局八大类和主流记账 App 的默认分类挑最接近的；确是会反复出现的新品类，就在 accounts.beancount 开新科目、在下面 prefix 配好开头、补进 rules/classification.md 和 rules/dictionary.md",
  "实在判断不了：记 Expenses:Other，摘要写「其他-<具体东西>」，note: 写清是什么，回报时告诉用户；不问用户记哪类",
  "连是消费、借出还是代垫都不清楚：先挂往来，不记费用（只有这类事实才问用户）",
]
# 「大类-事项」中不得单独用作事项的笼统词
vague_items = ["日用品", "消费", "支出", "杂项", "商品", "东西", "购物", "其他"]

# 摘要开头由记账科目决定；一笔分录有多个收支科目时，按金额最大者确定。
# 新开的收支科目须在此配置摘要开头，否则 check 报错；new-book 新建的账本自动追加各自的一段。
[naming.prefix.personal]
"Expenses:Food" = "餐饮-"
"Expenses:Housing" = "居住-"
"Expenses:Transport" = "交通-"
"Expenses:Shopping" = "购物-"
"Expenses:Entertainment" = "文娱-"
"Expenses:Travel" = "旅行-"
"Expenses:Learning" = "教育-"
"Expenses:Medical" = "医疗-"
"Expenses:Fitness" = "运动-"
"Expenses:PersonalCare" = "个护-"
"Expenses:Pet" = "宠物-"
"Expenses:Kids" = "育儿-"
"Expenses:Social" = "交际-"
"Expenses:Insurance" = "保险-"
"Expenses:Service" = "服务-"
"Expenses:Tax" = "税费-"
"Expenses:Finance" = "财务费用-"
"Expenses:SideBiz" = "副业成本-"
"Expenses:Other" = "其他-"
"Income:Salary" = "工资收入-"
"Income:Bonus" = "奖金收入-"
"Income:Labor" = "劳务收入-"
"Income:SideBiz" = "副业收入-"
"Income:Redpacket" = "红包收入-"
"Income:Invest" = "投资收益-"
"Income:Invest:Interest" = "利息收入-"
"Income:Benefit" = "社保入账-"
"Income:Other" = "其他收入-"

[naming.prefix.shop]
"Expenses:COGS" = "主营业务成本-"
"Expenses:Shipping" = "销售费用-"
"Expenses:Packaging" = "销售费用-"
"Expenses:Ads" = "销售费用-"
"Expenses:Tools" = "管理费用-"
"Expenses:Rent" = "管理费用-"
"Expenses:Salary" = "管理费用-"
"Expenses:PlatformFee" = "财务费用-"
"Expenses:Tax" = "税金-"
"Expenses:Other" = "其他-"
"Income:Revenue" = ["主营业务收入-", "销售退回"]
"Income:Other" = "其他业务收入-"

# 固定场景：分录只涉及下列科目时，对方与摘要只能按此书写；payee 省略表示对方不限，narration 省略表示摘要开头不限。
# 账户更名或新增结算账户后，同步修改 when 与 with。写法的完整对照见 rules/naming.md 第 7 节。
[[naming.patterns]]
book = "personal"
name = "自有账户之间的划转"
when = ["Assets:Cash", "Assets:Bank", "Assets:Alipay", "Assets:Wechat"]    # 分录只涉及这些科目
narration = ["银行转账-", "银行取现", "银行存现", "现金兑换"]
hint = '对方写转出机构，摘要写「银行转账-<转出>转<转入>」，如 "微信" "银行转账-微信转招行"；取现、存现写「银行取现」「银行存现」；与他人以现金兑换电子余额，对方写兑换对象，摘要写「现金兑换微信零钱」'

[[naming.patterns]]
book = "personal"
name = "负债的借入与偿还"
when = ["Liabilities:CreditCard", "Liabilities:Huabei", "Liabilities:Baitiao", "Liabilities:Loan", "Liabilities:Payable"]
with = ["Assets:Cash", "Assets:Bank", "Assets:Alipay", "Assets:Wechat"]    # 其余科目只能是这些
narration = ["偿还", "借款-", "其他应付款-", "信用卡取现"]
hint = '对方写信贷机构或出借人。还款如 "蚂蚁花呗" "偿还花呗"、"京东" "偿还京东白条"、"招商银行" "偿还招行信用卡"、"朋友小王" "偿还小王借款"；借入如 "国家开发银行" "借款-助学贷款放款"'

[[naming.patterns]]
book = "personal"
name = "个人账与店铺之间的往来"
when = ["Assets:Receivable:Shop", "Liabilities:Shop"]
with = ["Assets:Bank", "Assets:Wechat", "Assets:Alipay"]
payee = ["商店"]
narration = ["代垫商店", "代收商店", "收回商店", "归还商店"]
hint = '个人账不登记店铺的经营收支，固定写法如 "商店" "代垫商店采购款-<供应商>（股东往来）"'

[[naming.patterns]]
book = "shop"
name = "店铺与股东之间的资金往来"
when = ["Liabilities:OwnerLoan", "Assets:Receivable:Owner"]
with = ["Assets:Bank", "Assets:Alipay", "Assets:Wechat"]
payee = ["股东"]
narration = ["归还股东垫付款", "收回股东代收款"]
hint = '对方写「股东」，摘要写「归还股东垫付款（股东往来）」「收回股东代收款（股东往来）」'

# 对方、摘要或 note 中不得出现的写法：field 为 "narration"（摘要，默认）、"payee"（对方）或 "note"；
# pattern 为正则表达式，命中即拒绝；hint 为拒绝时给出的改法。误拦正常写法时，在 pattern 的排除字符中补充。
# field = "note" 的规则不检查导入来源的备注原文（自「<来源>备注：」起）。可选 tag、account 限定范围：
# 仅当分录带该标签、涉及该科目（含下级）时检查，用于拦截与标签、分录重复的信息。
[[naming.forbidden]]
name = "具体日期"
pattern = '\d{1,2}月\d{1,2}[日号]|(?<!\d)\d{1,2}号(?![线楼门口店桌厅馆院位车机仓柜铺色球电码汽油柴航风字房室库站台])|昨天|今天|明天|前天|昨晚|今晚'
hint = "交易日期由分录首行的日期表达，不写入摘要；所属期间可以保留，如「居住-9月房租」；其余日期信息写入 note:"

[[naming.forbidden]]
name = "具体时刻"
pattern = '(?<!\d)\d{1,2}[:：]\d{2}(?!\d)|(?<!\d)\d{1,2}点(?![券卡数心评赞击位读阵式])'
hint = "交易时刻写入 time: 元数据；班次、场次等写入 note:"

[[naming.forbidden]]
field = "payee"
name = "注册全称"
pattern = '有限公司|有限责任公司|个体工商户|经营部|收单'
hint = "对方写店名简称或业务描述，如「张记饭店」「便利店」，不写营业执照名称或收单机构名称"

[[naming.forbidden]]
field = "payee"
name = "未统一的统称"
pattern = '^(餐厅|饭店|饭馆|小卖部|小超市)$'
hint = "店名不明时同一类对方使用同一个统称：正餐堂食写「餐馆」，零售小店写「便利店」；已知店名的写店名简称"


# note 的栏目：note 写成「栏目：内容；栏目：内容」，栏目只能取本表各项，按本表顺序，各至多一次。
# 导入来源的备注原文以「<来源>备注：」开头写在末段，不受检查。规定见 rules/naming.md 第 5 节。
# 整表删除即不检查分栏格式。
[naming.note_labels]
"明细" = "交易的具体内容，如品名、规格、人数、所属期间、金额构成、款项的性质"
"支付" = "分录无法表达的收付情况，如代付账户、分次付款、提现与到账时刻、款项实际进出的账户"
"关联" = "与其他分录的对应关系，如退款的原单、同一次消费的其他分录、对应的收入或成本"
"核对" = "余额核对的数字，即实际余额与账面余额"
"依据" = "推定与补记的依据、缺失的信息、经确认的处理、待补的事项"

# note 的用语：只记录首行、标签、科目未表达的事实，写短语。
# 新增交易对象标签或结算账户时，仿照末尾几条补充 tag、account 限定的规则。
[[naming.forbidden]]
field = "note"
name = "口语"
pattern = '一起|顺便|顺手|帮人|帮忙|好像|大概是|应该是|记不清|不知道|忘了|啥|咋|[吧呢啊了]$|[吃喝买用]的$'
hint = "note 写书面短语，如「明细：牛肉面」「明细：伴侣点的米线」"

[[naming.forbidden]]
field = "note"
name = "自造的文言缩略"
pattern = '同食|共食|同饮|共饮|同购|自食|自饮'
hint = "使用通行的现代书面语；交易对象由标签表达，不写入 note"

[[naming.forbidden]]
field = "note"
name = "句号或末尾标点"
pattern = '。|[，；、：,;.]$'
hint = "note 写短语，不加句号，末尾不加标点；多项事实以「；」分隔"

[[naming.forbidden]]
field = "note"
name = "处理过程用语"
pattern = '用户|录入时刻|补记日'
hint = "只写事实，不写入账过程与科目去向；信息缺失写「依据：时间未报」，经确认的处理写「依据：经确认按…记」"

[[naming.forbidden]]
field = "note"
name = "账户尾号"
pattern = '尾号 ?\d+'
hint = "账户写简称，如「店铺经营卡」「对公账户」"

[[naming.forbidden]]
field = "note"
tag = "partner"
name = "标签已表达的交易对象"
pattern = '[与和跟同](伴侣|爱人|对象|女友|男友)(用餐|吃饭|共同消费|同行|出行)'
hint = "交易对象由 #partner 表达，note 不重复；一单之内的归属写「明细：伴侣点的米线」"

[[naming.forbidden]]
field = "note"
tag = "family"
name = "标签已表达的交易对象"
pattern = '[与和跟同](家人|父母)(用餐|吃饭|共同消费|同行|出行)'
hint = "交易对象由 #family 表达，note 不重复"

[[naming.forbidden]]
field = "note"
account = "Assets:Wechat"
name = "分录已表达的结算账户"
pattern = '微信(零钱)?(支付|付款|扣款|收款|到账)'
hint = "结算账户由分录表达，note 不重复"

[[naming.forbidden]]
field = "note"
account = "Assets:Alipay"
name = "分录已表达的结算账户"
pattern = '支付宝(余额)?(支付|付款|扣款|收款|到账)'
hint = "结算账户由分录表达，note 不重复"

[[naming.forbidden]]
field = "note"
account = "Liabilities:Huabei"
name = "分录已表达的结算账户"
pattern = '花呗(支付|付款)'
hint = "结算账户由分录表达，note 不重复"
