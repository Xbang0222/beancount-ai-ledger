# ============================================================
# 账套配置：有哪些账本、账本之间的往来怎么对账
# 说明见 README「配置 ledger.toml」。新增账本请用：
#   python3 scripts/ledger.py new-book <名称> [--template personal|business|minimal] [--link <已有账本>]
# ============================================================

[ledger]
timezone = "Asia/Shanghai"      # 记账时区：自动注入的 time、未来日期/时间校验都按它
base_currency = "CNY"           # 本位币：networth 折算合计的目标币种

[books.personal]
title = "个人账本（示例）"
kind = "personal"

[books.shop]
title = "网店（示例）"
kind = "business"

# personal ⇄ shop 往来（new-book --link 生成）：每对两侧余额相加必须为 0，reconcile 自动核对
[[mirrors]]
name = "personal 垫付 shop"
currency = "CNY"
accounts = { personal = "Assets:Receivable:Shop", shop = "Liabilities:OwnerLoan" }

[[mirrors]]
name = "personal 代收/占用 shop 资金"
currency = "CNY"
accounts = { personal = "Liabilities:Shop", shop = "Assets:Receivable:Owner" }
